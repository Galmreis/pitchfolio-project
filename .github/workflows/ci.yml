name: CI / Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest test suite
        run: npm test

  security:
    name: DevSecOps Vulnerability & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check npm dependency vulnerabilities
        run: npm audit --audit-level=high || true

  build:
    name: Production & Container Build Verification
    needs: [validate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build SSR application (Vite / Nitro)
        run: npm run build
        env:
          VITE_SUPABASE_PROJECT_ID: "mock-id"
          VITE_SUPABASE_URL: "https://mock.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "mock-key"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and verify Docker container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pitchfolio-project:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
